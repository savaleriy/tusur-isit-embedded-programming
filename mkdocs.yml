          - Задачи: Practice/01-safety-electronics/task.md
      - 2. Инструменты разработки:
          - Конспект: Practice/02-tooling/note.md
          - Задачи: Practice/02-tooling/task.md
      - 3. Цифровой ввод-вывод:
          - Конспект: Practice/03-digital-io/note.md
