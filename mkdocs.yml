site_name: Программирование микроконтроллеров
site_description:
  Материалы практических и лабораторных занятий по дисциплине
  "Программирование микроконтроллеров". Arduino UNO R3, ATmega328P, FreeRTOS.
site_author: Валерий Семенюк
site_url: https://savaleriy.github.io/tusur-isit-embedded-programming/

repo_url: https://github.com/savaleriy/tusur-isit-embedded-programming
repo_name: savaleriy/tusur-isit-embedded-programming
edit_uri: ""

copyright: ТУСУР

docs_dir: docs

watch:
  - Practice
  - Labs
  - Hardware
  - Appendix
  - Exam
  - Students
  - README.md
  - tools
  - hooks

theme:
  name: material
  language: ru
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Светлая тема

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  # slugify из pymdownx сохраняет кириллицу в якорях - без него
  # ссылки вида #3-способы-реализации не работают, а MkDocs ругается
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

plugins:
  - search:
      lang:
        - ru
        - en

extra_css:
  - stylesheets/extra.css

hooks:
  - hooks/sync_docs.py
  - hooks/tikz.py
  - hooks/copy_data.py
  - hooks/mathjax.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/savaleriy
      name: GitHub

